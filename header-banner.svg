<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
      <circle cx="0" cy="0" r="1" fill="#475569" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="260" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="820" cy="40" r="160" fill="#F59E0B" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="80" cy="220" r="140" fill="#38BDF8" fill-opacity="0.07" filter="url(#glow)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="898" height="258" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Left Monogram Emblem -->
  <g transform="translate(50, 48)">
    <!-- Hexagon Frame -->
    <rect x="0" y="0" width="76" height="76" rx="20" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <rect x="3" y="3" width="70" height="70" rx="17" fill="none" stroke="url(#amberGold)" stroke-width="1.5" stroke-dasharray="4 2" />
    
    <!-- Monogram SA -->
    <text x="38" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="url(#amberGold)" text-anchor="middle" letter-spacing="1">SA</text>
    
    <!-- Status Dot -->
    <circle cx="64" cy="14" r="5" fill="#10B981" />
    <circle cx="64" cy="14" r="8" fill="#10B981" fill-opacity="0.4" />
  </g>

  <!-- Title & Details -->
  <g transform="translate(150, 62)">
    <!-- Tag Pill -->
    <rect x="0" y="0" width="280" height="24" rx="12" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1" />
    <text x="140" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#FBBF24" text-anchor="middle" letter-spacing="1.5">PAID ADS ARCHITECT · SYSTEMS LEAD</text>

    <!-- Main Name -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">SHAHID AKRAM</text>

    <!-- Subtitle -->
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">
      Scaling brands with high-converting paid funnels, automated systems &amp; web apps.
    </text>
  </g>

  <!-- Bottom Metric Pills -->
  <g transform="translate(50, 182)">
    <!-- Pill 1: Meta Ads -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#3B82F6" />
      <text x="36" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="0.5">ACQUISITION</text>
      <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F1F5F9">Meta &amp; ROAS Scaling</text>
    </g>

    <!-- Pill 2: Operations & Estimating -->
    <g transform="translate(195, 0)">
      <rect width="200" height="42" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#F59E0B" />
      <text x="36" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="0.5">CONSTRUCTION TECH</text>
      <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F1F5F9">BuildEstimate Suite</text>
    </g>

    <!-- Pill 3: Automation -->
    <g transform="translate(410, 0)">
      <rect width="190" height="42" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#10B981" />
      <text x="36" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="0.5">DEV &amp; SYSTEMS</text>
      <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F1F5F9">PWA · Python · APIs</text>
    </g>

    <!-- Pill 4: Status -->
    <g transform="translate(615, 0)">
      <rect width="185" height="42" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#8B5CF6" />
      <text x="36" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="0.5">AVAILABILITY</text>
      <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F1F5F9">Open for Contracts</text>
    </g>
  </g>
</svg>